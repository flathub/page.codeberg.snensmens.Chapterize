id: page.codeberg.snensmens.Chapterize
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: chapterize
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"

modules:
  - modules/python-ffmpeg.yml
  - name: chapterize
    builddir: true
    buildsystem: meson
    sources:
      - type: git
        url: https://codeberg.org/snensmens/Chapterize.git
        tag: "2026.0.1"
        commit: 929a7e8bba7f9be213c9621a8c7397c9899bd632

